<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Game Hub Arcade</title>
<style>
:root{--bg:#000;--fg:#f4f1ea;--mut:#9aa39f;--card:#12171a;--line:#2c3a3c;--x:#4fc3b8;--o:#f0a45d;--s:min(92vw,54vh)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{--w:680px;position:absolute;inset:0;display:none;flex-direction:column;gap:14px;z-index:1;overflow:auto;
 padding-block:calc(env(safe-area-inset-top,0px) + 22px) calc(env(safe-area-inset-bottom,0px) + 22px);
 padding-inline:max(20px,calc((100vw - var(--w))/2))}
.screen.on{display:flex}
#catalog{--w:960px}#game{--w:1000px}
h1{font-size:clamp(46px,min(17vw,17vh),88px);line-height:.92;margin:auto 0 0;font-weight:700;letter-spacing:-1px}
h1 span{display:block;color:var(--x)}
h2{margin:6px 0 0;font-size:28px}
.by{color:var(--mut);font-size:16px;margin:6px 0 22px}.by b{color:var(--fg)}
button{font:inherit;color:var(--fg);background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px 18px;font-size:19px;font-weight:700;text-align:left;cursor:pointer}
button:active{transform:scale(.98)}button:focus-visible{outline:3px solid var(--x)}
.pri{background:var(--x);border-color:var(--x);color:#04100f;text-align:center;font-size:22px;padding:18px}
.row{display:flex;gap:10px}.row button{flex:1;text-align:center}
.sel{border-color:var(--x);box-shadow:inset 0 0 0 2px var(--x)}
.sub{color:var(--mut);font-weight:400;font-size:14px;display:block;margin-top:3px}
.sec{color:var(--mut);margin:12px 0 0;font-size:16px}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px}
.card{padding:10px;text-align:center;font-size:17px}
.card.soon{opacity:.5;pointer-events:none}
.th{display:block;width:100%;aspect-ratio:1;margin-bottom:8px;background:var(--bg);border-radius:14px}
.th path,.th circle,.th rect{fill:none;stroke:var(--mut);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.th .x{stroke:var(--x)}.th .o{stroke:var(--o)}.th .f{fill:var(--line);stroke:none}.th text{fill:var(--o);font:700 22px Georgia}
.gwrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.side{width:100%;display:flex;flex-direction:column;gap:14px}
#status{font-size:23px;font-weight:700;text-align:center;min-height:32px}
.board{width:var(--s);height:var(--s);display:grid;padding:10px;background:var(--card);border-radius:26px}
.c{padding:9%;border:0;border-radius:0;background:none;display:flex}
.c.r{border-right:2px solid var(--line)}.c.b{border-bottom:2px solid var(--line)}
.c.w{box-shadow:inset 0 0 0 999px rgba(127,127,127,.25)}
.c svg{width:100%;height:100%;overflow:visible}
.c svg path{fill:none;stroke-width:9;stroke-linecap:round}.c.X path{stroke:var(--x)}.c.O path{stroke:var(--o)}
@media(prefers-reduced-motion:no-preference){.c svg path{stroke-dasharray:1;animation:d .4s ease-out backwards}.c svg path+path{animation-delay:.18s}@keyframes d{from{stroke-dashoffset:1}}}
@media(orientation:landscape){:root{--s:min(82vh,52vw)}
 .gwrap{flex-direction:row;gap:6vw}.side{width:min(34vw,320px)}}
#snd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:9;width:46px;height:46px;border-radius:50%;padding:0;text-align:center;font-size:22px}
#pan{position:fixed;top:calc(env(safe-area-inset-top,0px) + 64px);right:12px;z-index:9;width:min(86vw,330px);display:none;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:12px;flex-direction:column;gap:8px}
#pan.on{display:flex}#pan button{padding:10px 12px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.th .dd{fill:var(--x)}
.c4b{height:auto;aspect-ratio:7/6;gap:6px}
.hole{border:0;padding:0;border-radius:50%;background:var(--bg);aspect-ratio:1}
.hole.X{background:var(--x)}.hole.O{background:var(--o)}.hole.w{box-shadow:0 0 0 4px var(--fg)}
.hand{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:78px}
.pc{width:54px;height:76px;border-radius:9px;background:#fffdf7;color:#111;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 22px Georgia;box-shadow:0 2px 6px #0006}
.pc.red{color:#c4281f}.pc.back{background:repeating-linear-gradient(45deg,var(--x),var(--x) 6px,var(--bg) 6px,var(--bg) 12px);border:3px solid #fffdf7}
button{background-image:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0));box-shadow:inset 0 1px 0 rgba(255,255,255,.07),0 10px 22px -14px #000;transition:transform .12s,border-color .15s}
button:hover{border-color:var(--x)}
.pri{box-shadow:0 12px 28px -10px var(--x)}.sel{box-shadow:0 0 0 2px var(--x),0 10px 24px -12px var(--x)}
.card{border-radius:22px}.card:hover{transform:translateY(-3px)}.th{border:2px solid var(--line)}
.c,.hole,.sq,.bc,.mcard{box-shadow:none}.sq:active,.bc:active,.mcard:active{transform:none}
.st{font-size:23px;font-weight:700;text-align:center;min-height:32px}
.cb{width:var(--s);height:var(--s);display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);padding:6px;border-radius:18px;background:#4a3524}
.sq{border:0;border-radius:0;padding:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s)/8*.74);line-height:1;position:relative;background:#e8d9b8}
.sq.d{background:#a67c52}.sq.lm{box-shadow:inset 0 0 0 999px rgba(240,164,93,.4)}.sq.sel{background:var(--x)}
.sq.mv::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.3)}.sq.cap::after{width:90%;height:90%;background:none;border:4px solid rgba(0,0,0,.35)}
.pw{color:#fffdf7;text-shadow:0 0 2px #000,0 0 2px #000,0 1px 3px #000}.pb{color:#1b1b1b}
.bsg{width:var(--s);aspect-ratio:1;display:grid;grid-template:repeat(10,1fr)/repeat(10,1fr);gap:2px;padding:6px;background:#0d3b4a;border-radius:18px}
.bsg.mini{width:calc(var(--s)*.55)}
.bc{padding:0;border:0;border-radius:4px;background:#1c6b80;position:relative}.bc.sh{background:#8aa0a8}.bc.mi::after{content:"";position:absolute;inset:36%;border-radius:50%;background:#e8f4f6}.bc.hi{background:#e0533d}
.mem{width:var(--s);aspect-ratio:1;display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:8px}
.mcard{padding:0;border-radius:14px;font-size:calc(var(--s)/4*.5);display:flex;align-items:center;justify-content:center;border:2px solid var(--line);background:repeating-linear-gradient(45deg,var(--x) 0 8px,var(--card) 8px 16px)}
.mcard.up{background:var(--card)}.mcard.ok{border-color:var(--x);opacity:.55}
.bgb{width:min(94vw,640px);display:grid;grid-template-columns:repeat(12,1fr);gap:2px;padding:6px;background:#4a3524;border-radius:16px}
.bpt{height:calc(min(94vw,640px)/12*4.2);padding:2px 0;border:0;border-radius:0;background:#e8d9b8;position:relative;display:flex;flex-direction:column;align-items:stretch;box-shadow:none}
.bpt::before{content:"";position:absolute;inset:0;background:#8a6444}.bpt.o::before{background:#c9a36f}
.bpt.top{justify-content:flex-start}.bpt.top::before{clip-path:polygon(0 0,100% 0,50% 92%)}
.bpt.bot{justify-content:flex-end}.bpt.bot::before{clip-path:polygon(0 100%,100% 100%,50% 8%)}
.bpt.sel{outline:3px solid var(--x);z-index:1}.bpt.tg{outline:3px dashed var(--o);z-index:1}.bpt small{position:relative;color:#000;text-align:center;font-size:12px}
.ck{display:block;width:78%;aspect-ratio:1;border-radius:50%;margin:1px auto;position:relative;z-index:1}
.ck.w{background:#fffdf7;border:2px solid #9a9a9a}.ck.b{background:#1b1b1b;border:2px solid #666}
.msw{width:var(--s);aspect-ratio:1;display:grid;grid-template:repeat(9,1fr)/repeat(9,1fr);gap:3px}
.mn{padding:0;border-radius:6px;font-size:calc(var(--s)/9*.5);font-weight:900;display:flex;align-items:center;justify-content:center;background:var(--card);box-shadow:none}
.mn.op{background:var(--bg);border-color:var(--line)}
.dab{width:var(--s);aspect-ratio:1;display:grid;grid-template:12px 1fr 12px 1fr 12px 1fr 12px 1fr 12px/12px 1fr 12px 1fr 12px 1fr 12px 1fr 12px}
.dt{background:var(--fg);border-radius:50%}
.eg{padding:0;border:0;border-radius:6px;background:var(--line);box-shadow:none;margin:2px}.eg.p1{background:var(--x)}.eg.p2{background:var(--o)}
.bx{border-radius:6px;margin:2px}.bx.p1{background:rgba(79,195,184,.4)}.bx.p2{background:rgba(240,164,93,.4)}
.cw{cursor:pointer}.cw.ok .pc{outline:3px solid var(--x)}

<canvas id="bg"></canvas>

<section class="screen on" id="home">
 <h1>GAME<span>HUB</span></h1>
 <p class="by" id="tag"></p>
 <button class="pri" onclick="go('catalog')">Choose a Game</button>
 <button onclick="surprise()">Random Game</button>
 <div id="favs" style="display:flex;flex-direction:column;gap:8px"></div>
 <button onclick="go('settings')">Settings</button>
</section>

<section class="screen" id="settings">
 <h2>Settings</h2>
 <p class="sec">Background color</p>
 <div class="row"><button id="tb" onclick="theme('dark')">Black</button><button id="tw" onclick="theme('light')">White</button></div>
 <p class="sec">Relaxing music</p>
 <div class="row"><button id="mon" onclick="setMusic(1)">On</button><button id="mof" onclick="setMusic(0)">Off</button></div>
 <p class="sec">Game sounds</p><div class="row"><button id="xon" onclick="setSfx(1)">On</button><button id="xof" onclick="setSfx(0)">Off</button></div>
 <p class="sec">Credits: GitHub <b>bogdan-dev-ro</b></p><p class="sec"><a href="https://github.com/bogdan-dev-ro/GameHubArcade/blob/main/LICENSE" style="color:var(--x)">License: GPL-3.0 (read it on GitHub)</a></p>
 <button onclick="goBack()" style="margin-top:auto">Back</button>
</section>

<section class="screen" id="catalog">
 <h2>Games</h2>
 <p class="sec">Play</p><div class="cat" id="games"></div>
 <p class="sec">Coming soon</p><div class="cat" id="soon"></div>
 <button onclick="goBack()" style="margin-top:20px">Back</button>
</section>

<section class="screen" id="setup">
 <h2 id="stitle"></h2><button id="cont" class="pri" style="display:none" onclick="contGame()">Continue saved game</button>
 <p class="sec" id="dch">Capture rule</p><div class="row" id="dcrow"><button id="dc1" onclick="setDcap(1)">Forced (official)</button><button id="dc0" onclick="setDcap(0)">Optional</button></div><p class="sec" id="clkh">Clock</p><div class="row" id="clkrow"></div><p class="sec">Choose your opponent</p>
 <button id="sf" onclick="begin('f')">Friend<span class="sub">Two players, one device</span></button>

<script>
const $=s=>document.querySelector(s);
let stack=['home'];
function render(){helpUI();const f=$('#sf');if(f)f.style.display=['nav','cards','gin'].includes(gk)?'none':'';document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===stack[stack.length-1]))}
function go(id){stack.push(id);render()}
function goBack(){if(stack.length<2)return false;stack.pop();render();return true}
addEventListener('keydown',e=>{if(e.key==='Escape')goBack()});
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}};

/* theme */
function theme(t){document.documentElement.dataset.theme=t;ls('theme',t);
 $('#tb').classList.toggle('sel',t==='dark');$('#tw').classList.toggle('sel',t==='light');paint()}

/* music: the 3 tracks play in order, one after another; each can be switched off */
const TR=[['the_quiet_gambit','The Quiet Gambit'],['the_velvet_gambit','The Velvet Gambit'],['midnight_gambit','Midnight Gambit']];
let musicOn=ls('music')!=='0',off=[],ti=-1;try{off=JSON.parse(ls('off')||'[]')}catch(e){}
const au=new Audio();au.onended=()=>next();
const active=()=>TR.map((_,i)=>i).filter(i=>!off.includes(i));
function next(){const a=active();if(!musicOn||!a.length){au.pause();ti=-1;panel();return}
 const n=a.find(i=>i>ti);ti=n===undefined?a[0]:n;au.src=`music/${TR[ti][0]}.mp3`;au.play().catch(()=>{});panel()}
function startAudio(){if(!musicOn||!au.paused)return;if(ti<0||off.includes(ti))next();else au.play().catch(()=>{})}
function tog(i){off=off.includes(i)?off.filter(x=>x!==i):[...off,i];ls('off',JSON.stringify(off));
 if(off.includes(i)&&i===ti)next();else if(musicOn&&au.paused)next();panel()}
function setMusic(on){musicOn=!!on;ls('music',on?'1':'0');$('#mon').classList.toggle('sel',!!on);$('#mof').classList.toggle('sel',!on);
 if(on){if(au.paused)next()}else au.pause();panel()}
function panel(){$('#pan').innerHTML=`<button class="${musicOn?'sel':''}" onclick="setMusic(${musicOn?0:1})">All music<span>${musicOn?'On':'Off'}</span></button><button class="${sfxOn?'sel':''}" onclick="setSfx(${sfxOn?0:1})">Game sounds<span>${sfxOn?'On':'Off'}</span></button>`+
 TR.map((t,i)=>`<button class="${off.includes(i)?'':'sel'}" onclick="tog(${i})"><span>${i===ti&&musicOn?'&#9654; ':''}${t[1]}</span><span>${off.includes(i)?'Off':'On'}</span></button>`).join('')+
 '<p class="sec" style="margin:0">Tracks play in order. Switch off the ones you do not want.</p>';
 $('#snd').textContent=(musicOn&&active().length)||sfxOn?'🔊':'🔇'}
addEventListener('pointerdown',startAudio);
document.addEventListener('visibilitychange',()=>{document.hidden?au.pause():startAudio()});

/* background: slowly drifting marks */
const cv=$('#bg'),cx=cv.getContext('2d');let P=[];
function size(){cv.width=innerWidth;cv.height=innerHeight}
function paint(){const s=getComputedStyle(document.documentElement);cx.clearRect(0,0,cv.width,cv.height);cx.lineWidth=4;cx.lineCap='round';
 for(const p of P){cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.globalAlpha=.17;cx.beginPath();
  if(p.t){cx.strokeStyle=s.getPropertyValue('--x');cx.moveTo(-p.s,-p.s);cx.lineTo(p.s,p.s);cx.moveTo(p.s,-p.s);cx.lineTo(-p.s,p.s)}
  else{cx.strokeStyle=s.getPropertyValue('--o');cx.arc(0,0,p.s,0,7)}cx.stroke();cx.restore()}}
function tick(){for(const p of P){p.y-=p.v;p.r+=p.w;if(p.y<-40){p.y=cv.height+40;p.x=Math.random()*cv.width}}paint();requestAnimationFrame(tick)}
size();addEventListener('resize',()=>{size();paint()});
for(let i=0;i<26;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:10+Math.random()*22,r:Math.random()*6,t:i%2,v:.12+Math.random()*.3,w:(Math.random()-.5)*.008});

/* catalog thumbnails */
const SV=b=>`<svg class="th" viewBox="0 0 100 100">${b}</svg>`;
function ttt(n){const c=100/n;let g='';
 for(let i=1;i<n;i++)g+=`<path d="M${i*c} 8V92M8 ${i*c}H92"/>`;
 for(let k=0;k<n;k++){const m=(k+.5)*c,r=c*.26;
  g+=k%2?`<circle class="o" cx="${m}" cy="${m}" r="${r}"/>`:`<path class="x" d="M${m-r} ${m-r}L${m+r} ${m+r}M${m+r} ${m-r}L${m-r} ${m+r}"/>`}
 return SV(g)}
const SOON={
 'Chess':SV([0,1,2,3].map(i=>[0,1,2,3].map(j=>(i+j)%2?`<rect class="f" x="${14+i*18}" y="${14+j*18}" width="18" height="18"/>`:'').join('')).join('')+'<circle class="o" cx="41" cy="41" r="9"/><path d="M32 59H50"/>'),
 'Backgammon':SV('<rect x="8" y="6" width="84" height="88" rx="5"/>'+[0,1,2,3,4,5].map(i=>{const x=13+i*12.3;return `<path class="${i%2?'x':'o'}" d="M${x} 10L${x+12.3} 10L${x+6.2} 44Z"/><path class="${i%2?'o':'x'}" d="M${x} 90L${x+12.3} 90L${x+6.2} 56Z"/>`}).join('')),
 'Blackjack':SV('<rect x="18" y="20" width="38" height="54" rx="6" transform="rotate(-10 37 47)"/><rect class="x" x="42" y="24" width="38" height="54" rx="6" transform="rotate(8 61 51)"/><text x="50" y="62">21</text>'),
 'Battleship':SV('<path d="M30 12V88M52 12V88M74 12V88M12 30H88M12 52H88M12 74H88"/><rect class="x" x="18" y="36" width="46" height="12" rx="6"/><circle class="o" cx="63" cy="63" r="6"/>'),
 'Card Games':SV('<rect x="20" y="22" width="34" height="50" rx="6" transform="rotate(-18 37 47)"/><rect class="x" x="33" y="20" width="34" height="50" rx="6"/><rect class="o" x="46" y="22" width="34" height="50" rx="6" transform="rotate(18 63 47)"/>')
};

 b.onclick=()=>{gk='ttt';N=n;$('#stitle').textContent=`Tic-Tac-Toe ${n}x${n}`;go('setup')};$('#sizes').append(b)}
let gk='ttt';
const BJT=SOON.Blackjack,CHT=SOON.Chess,NVT=SOON.Battleship;delete SOON.Blackjack;delete SOON.Chess;delete SOON.Battleship;
const BGT=SOON.Backgammon,CGT=SOON['Card Games'];delete SOON.Backgammon;delete SOON['Card Games'];
const MST=SV('<rect x="14" y="14" width="72" height="72" rx="8"/><path d="M38 14V86M62 14V86M14 38H86M14 62H86"/><text x="50" y="58" text-anchor="middle" style="font:30px sans-serif;fill:initial">💣</text>');
const DBT=SV('<path class="x" d="M20 20H50V50H20Z"/><path class="o" d="M50 50H80M50 50V80"/>'+[20,50,80].map(a=>[20,50,80].map(b=>`<circle cx="${a}" cy="${b}" r="3.5"/>`).join('')).join(''));
const SNT=SV('<path class="x" style="stroke-width:9" d="M18 74H50V44H78V26"/><circle class="o" cx="80" cy="74" r="7"/>');
const SUT=SV('<path d="M12 12H88V88H12ZM38 12V88M62 12V88M12 38H88M12 62H88"/><text x="26" y="33" text-anchor="middle">5</text><text x="50" y="58" text-anchor="middle">7</text><text x="74" y="82" text-anchor="middle">3</text>');
const MKT=SV('<rect x="8" y="30" width="84" height="40" rx="20"/>'+[0,1,2].map(i=>`<circle cx="${28+i*22}" cy="42" r="7"/><circle class="o" cx="${28+i*22}" cy="58" r="7"/>`).join(''));
const SLT=SV('<rect x="14" y="14" width="34" height="48" rx="5"/><rect class="x" x="30" y="26" width="34" height="48" rx="5"/><rect class="o" x="46" y="38" width="34" height="48" rx="5"/>');
const DMT=SV('<path d="M12 12H88V88H12Z"/><circle class="x" cx="35" cy="65" r="14"/><circle class="o" cx="65" cy="35" r="14"/>');
const T48T=SV('<rect class="x" x="14" y="14" width="34" height="34" rx="6"/><rect class="o" x="52" y="14" width="34" height="34" rx="6"/><rect x="14" y="52" width="34" height="34" rx="6"/><rect x="52" y="52" width="34" height="34" rx="6"/><text x="31" y="38" text-anchor="middle">2</text><text x="69" y="38" text-anchor="middle">4</text><text x="69" y="76" text-anchor="middle">8</text>');
const FBT=SV([[34,10],[52,10],[52,28],[70,28]].map(a=>`<rect class="o" x="${a[0]}" y="${a[1]}" width="16" height="16" rx="3"/>`).join('')+[[16,66],[34,66],[52,66],[34,48]].map(a=>`<rect class="x" x="${a[0]}" y="${a[1]}" width="16" height="16" rx="3"/>`).join(''));
const BPT=SV('<rect x="10" y="10" width="80" height="80" rx="8"/>'+[[16,16,'x'],[34,16,'x'],[52,16,'x'],[16,34,'o'],[52,52,'o'],[70,52,'o'],[70,70,'x']].map(a=>`<rect class="${a[2]}" x="${a[0]}" y="${a[1]}" width="15" height="15" rx="3"/>`).join(''));
const GRT=SV('<rect x="16" y="22" width="34" height="50" rx="5" transform="rotate(-14 33 47)"/><rect class="x" x="33" y="20" width="34" height="50" rx="5"/><rect class="o" x="50" y="22" width="34" height="50" rx="5" transform="rotate(14 67 47)"/><text x="50" y="52" text-anchor="middle">G</text>');
const MT=SV('<rect class="x" x="14" y="14" width="34" height="34" rx="6"/><rect x="52" y="14" width="34" height="34" rx="6"/><rect x="14" y="52" width="34" height="34" rx="6"/><rect class="o" x="52" y="52" width="34" height="34" rx="6"/><text x="31" y="40" text-anchor="middle" style="font:24px sans-serif;fill:initial">🌿</text><text x="69" y="78" text-anchor="middle" style="font:24px sans-serif;fill:initial">🐚</text>');

let fav=[];try{fav=JSON.parse(ls('fav')||'[]')}catch(e){}
const GAMES=[['Tic-Tac-Toe',ttt(3),()=>go('ttt')],['Connect Four',C4T,()=>{gk='c4';$('#stitle').textContent='Connect Four';go('setup')}],['Chess',CHT,SU('chess','Chess')],['Battleship',NVT,SU('nav','Battleship')],['Memory',MT,SU('mem','Memory')],['Backgammon',BGT,SU('back','Backgammon')],['Crazy Eights',CGT,SU('cards','Crazy Eights')],['Dots and Boxes',DBT,SU('dab','Dots and Boxes')],['Minesweeper',MST,()=>{go('mine');swStart()}],['Snake',SNT,()=>{go('snake');snStart()}],['Sudoku',SUT,()=>{go('sudoku');suLoad()}],['Mancala',MKT,SU('mank','Mancala')],['Solitaire',SLT,()=>{go('soli');lLoad()}],['Dame',DMT,SU('dame','Dame')],['2048',T48T,()=>{go('g2048');tStart()}],['Falling Blocks',FBT,()=>{go('fall');fStart()}],['Block Puzzle',BPT,()=>{go('blkp');xStart()}],['Gin Rummy',GRT,SU('gin','Gin Rummy')],['Blackjack',BJT,()=>{bjScore=0;go('bj');bjStart()}]];
function renderGames(){const g=$('#games');g.innerHTML='';[...GAMES].sort((a,b)=>fav.includes(b[0])-fav.includes(a[0])).forEach(([k,t,f])=>{
 const w=document.createElement('div');w.className='gc';const b=document.createElement('button');b.className='card';b.innerHTML=t+k;b.onclick=f;

function renderFavs(){const e=$('#favs');e.innerHTML='';const fv=GAMES.filter(g=>fav.includes(g[0]));if(!fv.length)return;
 e.innerHTML='<p class="sec" style="margin:6px 0 0">Your favorites</p><div class="row" style="flex-wrap:wrap" id="favr"></div>';

for(const k in SOON){const b=document.createElement('button');b.className='card soon';b.innerHTML=SOON[k]+k;$('#soon').append(b)}
if(!Object.keys(SOON).length){$('#soon').previousElementSibling.remove();$('#soon').remove()}

/* Tic-Tac-Toe */
let K=3,B=[],turn='X',mode='f',over=false;
const D=[[1,0],[0,1],[1,1],[1,-1]];
const MARK={X:'<svg viewBox="0 0 100 100"><path pathLength="1" d="M18 20C38 38 60 62 82 82"/><path pathLength="1" d="M82 18C62 38 40 62 19 81"/></svg>',
 O:'<svg viewBox="0 0 100 100"><path pathLength="1" d="M52 14C78 12 88 38 84 58C80 82 54 90 34 82C14 72 12 42 28 26C34 20 44 15 56 16"/></svg>'};
function begin(m){mode=m;const S={ttt:['game',()=>reset()],c4:['c4',()=>c4start()],chess:['chess',()=>chessStart()],nav:['nav',()=>nStart()],mem:['mem',()=>mStart()],back:['back',()=>bStart()],cards:['cards',()=>cStart()],gin:['gin',()=>rStart()],dab:['dab',()=>dStart()],dame:['dame',()=>dmStart()],mank:['mank',()=>kStart()]}[gk];go(S[0]);S[1]()}

 for(const[d,e]of D){let i=1;while(i<K){const R=r+e*i,C=c+d*i;if(R<0||R>=N||C<0||C>=N||b[R*N+C]!==p)break;i++}

const empt=b=>b.map((v,i)=>v?-1:i).filter(i=>i>=0);

function med(){const e=empt(B);
 for(const i of e)if(wins(i,'O'))return i;

 const n=e.filter(near);return pick(n.length?n:e)}
function mm(b,p,d){const w=win(b);if(w)return b[w[0]]==='O'?10-d:d-10;const e=empt(b);if(!e.length)return 0;

  for(let j=0;j<K;j++){const R=r+e*(o+j),C=c+d*(o+j);if(R<0||R>=N||C<0||C>=N){ok=false;break}const v=B[R*N+C];if(v===q){ok=false;break}if(v===p)m++}
  if(ok)t+=Math.pow(8,m)}

 if(N===3){let bs=-99,bi=[];for(const i of e){B[i]='O';const v=mm(B,'X',1);B[i]='';if(v>bs){bs=v;bi=[i]}else if(v===bs)bi.push(i)}return pick(bi)}

/* Connect Four */
const CR=6,CC=7,W=[0,1,5,25,1000];let G=[],ct='X',cOver=false;
function c4start(){G=Array(CR*CC).fill('');cH=[];ct='X';cOver=false;const b=$('#c4b');b.innerHTML='';b.style.gridTemplateColumns=`repeat(${CC},1fr)`;

function c4say(t){$('#c4s').textContent=t||(mode==='f'?`Player ${ct==='X'?1:2}'s turn`:ct==='X'?'Your turn':'Robot is thinking...')}
const row=(c,g)=>{for(let r=CR-1;r>=0;r--)if(!g[r*CC+c])return r;return -1};
const cols=g=>[3,2,4,1,5,0,6].filter(c=>row(c,g)>=0);
function c4win(g){for(let r=0;r<CR;r++)for(let c=0;c<CC;c++){const p=g[r*CC+c];if(!p)continue;
 for(const[d,e]of D){let i=1;while(i<4){const R=r+e*i,C=c+d*i;if(R<0||R>=CR||C<0||C>=CC||g[R*CC+C]!==p)break;i++}
  if(i===4)return[0,1,2,3].map(j=>(r+e*j)*CC+c+d*j)}}return null}
function drop(c){if(cOver)return;const r=row(c,G);if(r<0)return;G[r*CC+c]=ct;cH.push(c);sfx('drop');$('#c4b').children[r*CC+c].classList.add(ct);
 const w=c4win(G);
 if(w){cOver=true;sfx('win');w.forEach(j=>$('#c4b').children[j].classList.add('w'));c4say(mode==='f'?`Player ${ct==='X'?1:2} wins!`:ct==='X'?'You win!':'Robot wins!');return}
 if(!G.includes('')){cOver=true;c4say('Draw');return}
 ct=ct==='X'?'O':'X';c4say();if(mode!=='f'&&ct==='O')setTimeout(()=>{if(!cOver)drop(mode==='h'?c4hard():c4med())},500)}
function c4try(c,p){const r=row(c,G);G[r*CC+c]=p;const w=c4win(G);G[r*CC+c]='';return !!w}
function c4med(){const a=cols(G);for(const c of a)if(c4try(c,'O'))return c;for(const c of a)if(c4try(c,'X'))return c;return Math.random()<.4?pick(a):pick(a.slice(0,3))}
function ev(g){let s=0;for(let r=0;r<CR;r++){if(g[r*CC+3]==='O')s+=3;if(g[r*CC+3]==='X')s-=3;
 for(let c=0;c<CC;c++)for(const[d,e]of D){let o=0,x=0,bad=0;for(let i=0;i<4;i++){const R=r+e*i,C=c+d*i;if(R<0||R>=CR||C<0||C>=CC){bad=1;break}const v=g[R*CC+C];if(v==='O')o++;else if(v==='X')x++}
  if(!bad&&!(o&&x))s+=W[o]-W[x]}}return s}
function ab(g,p,d,a,b){const w=c4win(g);if(w)return g[w[0]]==='O'?1e5+d:-1e5-d;const m=cols(g);if(!m.length||!d)return ev(g);
 let v=p==='O'?-1e9:1e9;for(const c of m){const r=row(c,g);g[r*CC+c]=p;const t=ab(g,p==='O'?'X':'O',d-1,a,b);g[r*CC+c]='';
  if(p==='O'){v=Math.max(v,t);a=Math.max(a,v)}else{v=Math.min(v,t);b=Math.min(b,v)}if(a>=b)break}return v}
function c4hard(){let bs=-1e9,bc=[];for(const c of cols(G)){const r=row(c,G);G[r*CC+c]='O';const v=ab(G,'X',5,-1e9,1e9);G[r*CC+c]='';if(v>bs){bs=v;bc=[c]}else if(v===bs)bc.push(c)}return pick(bc)}

let deck=[],ph=[],dh=[],bjOver=true,bjScore=0;

 if(d>21)bjEnd('Dealer busts. You win!',1);else if(p>d)bjEnd('You win!',1);else if(p<d)bjEnd('Dealer wins.',-1);else bjEnd('Push (tie).',0)}

const PV={p:100,n:320,b:330,r:500,q:900,k:0},N8=[[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]],

 const add=(R,C)=>{if(R<0||R>7||C<0||C>7)return false;const q=b[R*8+C];if(q&&(q<'a')===W)return false;m.push([i,R*8+C]);return !q};
 if(l==='p'){const d=W?-1:1,R=r+d;if(R>=0&&R<8){if(!b[R*8+c]){m.push([i,R*8+c]);if(r===(W?6:1)&&!b[(r+2*d)*8+c])m.push([i,(r+2*d)*8+c])}
  for(const x of[-1,1]){const C=c+x;if(C<0||C>7)continue;const q=b[R*8+C];if(q&&(q<'a')!==W)m.push([i,R*8+C]);else if(!q&&R*8+C===b.ep)m.push([i,R*8+C])}}}
 else if(l==='n'||l==='k'){for(const[a,e]of l==='n'?N8:[...ST,...DG])add(r+a,c+e);
  if(l==='k'&&!nc&&b.cr&&i===(W?60:4)){const o=W?'b':'w',h=i;
   if(b.cr.includes(W?'K':'k')&&!b[h+1]&&!b[h+2]&&b[h+3]===(W?'R':'r')&&!att(b,h,o)&&!att(b,h+1,o)&&!att(b,h+2,o))m.push([i,h+2]);
   if(b.cr.includes(W?'Q':'q')&&!b[h-1]&&!b[h-2]&&!b[h-3]&&b[h-4]===(W?'R':'r')&&!att(b,h,o)&&!att(b,h-1,o)&&!att(b,h-2,o))m.push([i,h-2])}}
 else for(const[a,e]of l==='b'?DG:l==='r'?ST:[...DG,...ST]){let R=r+a,C=c+e;while(add(R,C)){R+=a;C+=e}}}return m}
function att(b,sq,by){const c=b.slice();c[sq]=by==='w'?'k':'K';return gen(c,by,1).some(m=>m[1]===sq)}
function mk(b,[f,t,pr]){const n=b.slice(),p=n[f];n.cr=b.cr||'';n.ep=-1;

 for(const x of[f,t]){const k={60:'KQ',4:'kq',63:'K',56:'Q',7:'k',0:'q'}[x];if(k)for(const y of k)n.cr=n.cr.replace(y,'')}return n}
function chk(b,t){const k=b.indexOf(t==='w'?'K':'k');return k<0||gen(b,t==='w'?'b':'w',1).some(m=>m[1]===k)}
const legal=(b,t)=>gen(b,t).filter(m=>!chk(mk(b,m),t));
function evb(b){let s=0;for(let i=0;i<64;i++){const p=b[i];if(!p)continue;const l=p.toLowerCase(),r=i>>3,c=i&7;let v=PV[l];

 for(const x of m){const r=srch(mk(b,x),t==='w'?'b':'w',d-1,a,be);if(t==='b'){v=Math.max(v,r);a=Math.max(a,v)}else{v=Math.min(v,r);be=Math.min(be,v)}if(a>=be)break}return v}

 for(const v of bc.sort(()=>Math.random()-.5)){b[bi]=v;if(fill(b))return true}b[bi]=0;return false}

 for(const i of [...Array(81).keys()].sort(()=>Math.random()-.5)){if(n>=rm)break;const v=SG[i];SG[i]=0;if(cnt(SG.slice(),2)!==1)SG[i]=v;else n++}

/* Mancala (Kalah): your pits are the bottom row, store on the right */
let KB=[],kt=0,kend=false;
function ksow(b,i,t){const n=b.slice(),own=t?13:6,opp=t?6:13;let s=n[i],j=i;n[i]=0;while(s){j=(j+1)%14;if(j===opp)continue;n[j]++;s--}

const kdone=b=>!b.slice(0,6).some(x=>x)||!b.slice(7,13).some(x=>x);
function kfin(b){const n=b.slice();n[6]+=b.slice(0,6).reduce((x,y)=>x+y);n[13]+=b.slice(7,13).reduce((x,y)=>x+y);for(let i=0;i<14;i++)if(i!==6&&i!==13)n[i]=0;return n}
function kStart(){KB=[4,4,4,4,4,4,0,4,4,4,4,4,4,0];kt=0;kend=false;kDraw()}
function kPlay(i,bot){if(kend||!KB[i]||(i>6?1:0)!==kt||(!bot&&mode!=='f'&&kt===1))return;sfx('seed');const[n,ex]=ksow(KB,i,kt);KB=n;
 if(kdone(KB)){KB=kfin(KB);kend=true}else if(!ex)kt=1-kt;kDraw();if(!kend&&mode!=='f'&&kt===1)setTimeout(()=>kPlay(kbot(),1),700)}
function kval(b,t,d){if(kdone(b)){const f=kfin(b);return f[13]-f[6]}if(!d)return b[13]-b[6];let v=t?-99:99;
 for(const i of t?[7,8,9,10,11,12]:[0,1,2,3,4,5]){if(!b[i])continue;const[n,ex]=ksow(b,i,t),r=kval(n,ex?t:1-t,d-1);v=t?Math.max(v,r):Math.min(v,r)}return v}
function kbot(){const ps=[7,8,9,10,11,12].filter(i=>KB[i]);
 if(mode==='m'){const ex=ps.filter(i=>ksow(KB,i,1)[1]);return pick(ex.length&&Math.random()<.6?ex:ps)}
 let bs=-99,bl=[];for(const i of ps){const[n,ex]=ksow(KB,i,1),v=kval(n,ex?1:0,6);if(v>bs){bs=v;bl=[i]}else if(v===bs)bl.push(i)}return pick(bl)}
function kDraw(){const g=$('#kb');g.innerHTML='';const mkp=(i,c)=>{const b=document.createElement('button');b.className='pit '+c;b.textContent=KB[i];b.setAttribute('aria-label','pit');if(c==='mine')b.onclick=()=>kPlay(i,0);else if(mode==='f'&&c==='')b.onclick=()=>kPlay(i,0);return b};
 g.append(mkp(13,'store'),...[12,11,10,9,8,7].map(i=>mkp(i,'')),mkp(6,'store'),...[0,1,2,3,4,5].map(i=>mkp(i,'mine')));
 $('#ks').textContent=(kend?(KB[6]===KB[13]?'Draw!':mode==='f'?`Player ${KB[6]>KB[13]?1:2} wins!`:KB[6]>KB[13]?'You win!':'Robot wins!'):mode==='f'?`Player ${kt+1}'s turn`:kt?'Robot is thinking...':'Your turn')+`  ·  ${KB[6]} : ${KB[13]}`}

/* Dame (checkers): captures are compulsory, kings move both ways */
let dcap=ls('dcap')!=='0',DB=[],dtn='w',dsel=-1,dmv=[],dend=false,dlast=-1;
function jmp(b,pos,path,caps,k,t,out){let any=0;
 for(const dr of k?[-1,1]:[t==='w'?-1:1])for(const dc of[-1,1]){const r=(pos>>3)+dr,c=(pos&7)+dc,r2=r+dr,c2=c+dc;if(r2<0||r2>7||c2<0||c2>7)continue;const m=r*8+c,e=r2*8+c2;
  if(b[m]&&b[m].toLowerCase()!==t&&!b[e]&&!caps.includes(m)){any=1;jmp(b,e,[...path,e],[...caps,m],k,t,out)}}
 if(!any&&caps.length)out.push({p:path,c:caps})}
function dgen(b,t){const caps=[],simp=[];for(let i=0;i<64;i++){const p=b[i];if(!p||p.toLowerCase()!==t)continue;const k=p!==t;
 for(const dr of k?[-1,1]:[t==='w'?-1:1])for(const dc of[-1,1]){const r=(i>>3)+dr,c=(i&7)+dc;if(r>=0&&r<8&&c>=0&&c<8&&!b[r*8+c])simp.push({p:[i,r*8+c],c:[]})}
 jmp(b,i,[i],[],k,t,caps)}return dcap?(caps.length?caps:simp):caps.concat(simp)}
function dap(b,m,t){const n=b.slice(),f=m.p[0],e=m.p[m.p.length-1];let p=n[f];n[f]='';m.c.forEach(x=>n[x]='');if((t==='w'&&e<8)||(t==='b'&&e>55))p=p.toUpperCase();n[e]=p;return n}
function dev(b){let s=0;for(let i=0;i<64;i++){const p=b[i];if(!p)continue;const r=i>>3,v=p!==p.toLowerCase()?170:100+(p==='b'?r:7-r)*4;s+=p.toLowerCase()==='b'?v:-v}return s}
function dsr(b,t,d,a,be){const m=dgen(b,t);if(!m.length)return t==='b'?-1e5-d:1e5+d;if(!d)return dev(b);let v=t==='b'?-1e9:1e9;
 for(const x of m){const r=dsr(dap(b,x,t),t==='b'?'w':'b',d-1,a,be);if(t==='b'){v=Math.max(v,r);a=Math.max(a,v)}else{v=Math.min(v,r);be=Math.min(be,v)}if(a>=be)break}return v}
function dbot2(){let bs=-1e9,bl=[];for(const x of dgen(DB,'b')){const n=dap(DB,x,'b'),v=mode==='h'?dsr(n,'w',3,-1e9,1e9):dev(n)+Math.random()*60;if(v>bs){bs=v;bl=[x]}else if(v===bs)bl.push(x)}return pick(bl)}

function dmStart(){DB=Array(64).fill('');for(let i=0;i<64;i++){const r=i>>3,c=i&7;if((r+c)%2){if(r<3)DB[i]='b';else if(r>4)DB[i]='w'}}dtn='w';dsel=-1;dmv=[];dend=false;dlast=-1;dmDraw()}
function dmStat(){if(!dgen(DB,dtn).length){dend=true;const w=dtn==='w'?'b':'w';return mode==='f'?(w==='w'?'White':'Black')+' wins!':w==='w'?'You win!':'Robot wins!'}
 return(mode==='f'?(dtn==='w'?'White':'Black')+' to move':dtn==='w'?'Your turn (White)':'Robot is thinking...')+(dcap&&dgen(DB,dtn)[0].c.length?' - capture required':'')}
function dmDraw(){const g=$('#dm');g.innerHTML='';for(let i=0;i<64;i++){const p=DB[i],q=document.createElement('button');
 q.className='sq'+(((i>>3)+(i&7))%2?' d':'')+(i===dsel?' sel':'')+(i===dlast?' lm':'')+(dmv.some(x=>x.p[x.p.length-1]===i)?' mv':'');q.setAttribute('aria-label','square');
 if(p)q.innerHTML=`<span class="dp ${p.toLowerCase()}">${p!==p.toLowerCase()?'&#9819;\uFE0E':''}</span>`;q.onclick=()=>dmClick(i);g.append(q)}$('#dms').textContent=dmStat()}
function dmClick(i){if(dend||(mode!=='f'&&dtn==='b'))return;const mv=dmv.find(x=>x.p[x.p.length-1]===i);if(dsel>=0&&mv){dmDo(mv);return}
 const p=DB[i];dsel=-1;dmv=[];if(p&&p.toLowerCase()===dtn){const ms=dgen(DB,dtn).filter(x=>x.p[0]===i);if(ms.length){dsel=i;dmv=ms}}dmDraw()}

function lStart(){const d=[];for(let s=0;s<4;s++)for(let r=1;r<14;r++)d.push({r,s,up:0});d.sort(()=>Math.random()-.5);KT=[];
 for(let c=0;c<7;c++){KT.push(d.splice(0,c+1));KT[c][c].up=1}KS=d;KW=[];KF=[[],[],[],[]];ksel=null;lDraw()}

const lfound=c=>KF[c.s].length===c.r-1;
const lcards=()=>!ksel?[]:ksel.k==='w'?[KW[KW.length-1]]:KT[ksel.col].slice(ksel.idx);

 if(ksel&&!(ksel.k==='t'&&ksel.col===col)){const cs=lcards();if(cs.length&&lcan(cs[0],col)){lremove();KT[col].push(...cs);ksel=null;lDraw();return}}

 if(ksel&&ksel.k==='t'&&ksel.col===col&&ksel.idx===idx&&idx===t.length-1){lToF();return}ksel={k:'t',col,idx};lDraw()}

  KF.map((f,s)=>f.length?lcard(f[f.length-1],`onclick="lTapF(${s})"`,0):`<div class="sk em" onclick="lTapF(${s})">${SU4[s]}\uFE0E</div>`).join('');

/* how to play */
const RULES={
 game:['Tic-Tac-Toe','Take turns placing X and O. Get 3 in a row on 3x3, 4 on 4x4 and 5x5, or 5 on 6x6 and 7x7 (across, down or diagonal) to win. You are X and go first. Turn on Auto next round to start a new game automatically 5 seconds after each one ends.'],

function rTakeStock(){if(rt!=='p'||rph!=='draw'||rend)return;if(rs.length<=2){rDrawEnd();return}const c=rs.pop();rh.push(c);rsort();rnewC=c;rph='disc';rmsg='Tap a card to discard';sfx('deal');rDraw()}
function rTakeDisc(){if(rt!=='p'||rph!=='draw'||rend)return;const c=rd.pop();rh.push(c);rsort();rnewC=c;rph='disc';rmsg='Tap a card to discard';sfx('deal');rDraw()}
function rKnockBtn(){if(rph!=='disc'||rt!=='p'||rend)return;rknock=!rknock;rmsg=rknock?'Knock: discard a card to end the round (deadwood 10 or less)':'Tap a card to discard';rDraw()}
function rDisc(i){if(rt!=='p'||rph!=='disc'||rend)return;const c=rh.splice(i,1)[0];
 if(rknock&&rAn(rh).dead>10){rh.push(c);rsort();rmsg='Deadwood must be 10 or less to knock';rDraw();return}
 rd.push(c);sfx('place');if(rknock){rShow('p');return}
 rt='r';rph='bot';rmsg='Robot is thinking...';rDraw();setTimeout(rBot,1000)}
function rBot(){if(rend)return;if(rs.length<=2){rDrawEnd();return}const top=rd[rd.length-1],cur=rAn(rr).dead,wt=rBD(rr.concat(top)).dead;
 const take=wt<cur||(mode==='m'&&Math.random()<.2&&wt<=cur);let msg,c;
 if(take){c=rd.pop();msg='Robot took the '+rc(c).join('')+' from the discard'}else{c=rs.pop();msg='Robot drew from the deck'}
 rr.push(c);sfx('deal');const b=rBD(rr),d=rr.splice(b.i,1)[0];rd.push(d);sfx('place');const ad=rAn(rr).dead;
 if(ad<=10&&(mode==='h'||ad<=5||Math.random()<.4)){rShow('r',msg+' and knocked!');return}
 rt='p';rph='draw';rmsg=msg+', discarded '+rc(d).join('')+'. Your turn';rDraw()}
function rShow(k,pre){const a=rAn(rh).dead,b=rAn(rr).dead,me=k==='p',kd=me?a:b,od=me?b:a;let t,w;
 if(kd===0){w=me?0:1;t=`Gin! ${me?'You score':'Robot scores'} ${25+od}`;rsc[w]+=25+od}
 else if(od<=kd){w=me?1:0;t=`Undercut! ${me?'Robot':'You'} score ${25+kd-od}`;rsc[w]+=25+kd-od}
 else{w=me?0:1;t=`${me?'You knock':'Robot knocks'}: ${kd} against ${od}. ${me?'You score':'Robot scores'} ${od-kd}`;rsc[w]+=od-kd}
 rph='over';rend=true;rmsg=(pre?pre+' ':'')+t;sfx(w===0?'win':'lose');rDraw()}
RULES.blkp=['Block Puzzle','Drag a shape from the bottom onto the board. Fill a whole row or column and it disappears; clearing several lines at once scores much more. The game ends when none of the three shapes fits anywhere.'];
RULES.gin=['Gin Rummy','Make sets (3 or 4 of a kind) and runs (3 or more in a row of the same suit, Ace is low). Each turn draw from the deck or take the top discard, then discard one card. Cards outside sets and runs are deadwood (face cards 10, Ace 1); the outlined cards are in a set or run. When your deadwood is 10 or less, press Knock and discard to end the round: if yours is lower you score the difference. Zero deadwood is Gin (+25). If the other player ties or has less, they undercut you (+25). Laying off cards is not included.'];
